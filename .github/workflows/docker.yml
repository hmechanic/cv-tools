name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build image
        run: docker build --tag cv-tools:test .

      - name: Generate CV
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workdir" \
            cv-tools:test \
            ./run.sh --no-deps

      - name: Verify PDF
        run: test -s output/output.pdf
